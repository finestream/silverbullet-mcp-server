# Test instance: SilverBullet in multi-space mode, provisioned by `silverbullet setup`.
#
#   node test/instance.ts up     # starts this working copy's instance and bootstraps it (project name and port: see instance.ts)
#   node test/run.ts             # the checks
#   node test/instance.ts down   # remove everything (down -v)
#
# A plain clone and CI use the project sbmcp-test on http://127.0.0.1:3300, for example:
#   docker compose -f test/compose.yaml up -d --wait
#
# Another release: SB_IMAGE=ghcr.io/silverbulletmd/silverbullet:edge node test/instance.ts up
#
# Grants (see lib/bootstrap.ts):
#   space  path    alice                 bob                   scan
#   alpha  /alpha  write + Runtime API   read                  write
#   beta   /beta   -                     write + Runtime API   write
#   gamma  /gamma  write + Runtime API   read                  write
#   admin is an administrator and is used by the bootstrap and the runtime checks.

name: ${COMPOSE_PROJECT_NAME:-sbmcp-test}

services:
  setup:
    image: ${SB_IMAGE:-ghcr.io/silverbulletmd/silverbullet:latest}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - test -f /data/users.json || /silverbullet setup /data --admin "admin:$$SB_ADMIN_PASSWORD"
    environment:
      SB_ADMIN_PASSWORD: ${SB_ADMIN_PASSWORD:-admin-test-password}
    volumes:
      - sbdata:/data

  silverbullet:
    image: ${SB_IMAGE:-ghcr.io/silverbulletmd/silverbullet:latest}
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      PUID: "0"
      RUST_LOG: info
    ports:
      - "127.0.0.1:${SB_PORT:-3300}:3000"
    volumes:
      - sbdata:/data
    healthcheck:
      # The admin API answers 401 once the multi-space stack is mounted.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/.dashboard/api/admin/spaces)\" = 401"]
      interval: 2s
      retries: 30

volumes:
  sbdata:
