# Test instance: SilverBullet in multi-space mode, provisioned by `silverbullet setup`.
#
#   docker compose -f test/compose.yaml up -d --wait   # SilverBullet on http://127.0.0.1:3300
#   node test/run.ts                                    # bootstraps users, spaces, tokens, seeds; runs the checks
#   docker compose -f test/compose.yaml down -v         # remove everything
#
# Another release: SB_IMAGE=ghcr.io/silverbulletmd/silverbullet:edge docker compose -f test/compose.yaml up -d --wait
#
# Grants (see lib/bootstrap.ts):
#   space  path    alice                 bob
#   alpha  /alpha  write + Runtime API   read
#   beta   /beta   -                     write + Runtime API
#   admin is an administrator and is used by the bootstrap and the runtime checks.

name: sbmcp-test

services:
  setup:
    image: ${SB_IMAGE:-ghcr.io/silverbulletmd/silverbullet:latest}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - test -f /data/users.json || /silverbullet setup /data --admin "admin:$$SB_ADMIN_PASSWORD"
    environment:
      SB_ADMIN_PASSWORD: ${SB_ADMIN_PASSWORD:-admin-test-password}
    volumes:
      - sbdata:/data

  silverbullet:
    image: ${SB_IMAGE:-ghcr.io/silverbulletmd/silverbullet:latest}
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      PUID: "0"
      RUST_LOG: info
    ports:
      - "127.0.0.1:${SB_PORT:-3300}:3000"
    volumes:
      - sbdata:/data
    healthcheck:
      # The admin API answers 401 once the multi-space stack is mounted.
      test: ["CMD-SHELL", "test \"$$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/.dashboard/api/admin/spaces)\" = 401"]
      interval: 2s
      retries: 30

volumes:
  sbdata:
